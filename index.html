<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    class ErrorBoundary extends React.Component {
      state = { hasError: false, error: null };

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="p-6 text-center text-red-600">
              <h1>Something went wrong!</h1>
              <p>{this.state.error?.message || 'Unknown error'}</p>
              <button
                onClick={() => {
                  localStorage.clear();
                  window.location.reload();
                }}
                className="mt-4 p-2 rounded text-white bg-red-600"
              >
                Clear Data and Reload
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const App = () => {
      const [csvData, setCsvData] = useState([]);
      const [trackerData, setTrackerData] = useState([]);
      const [pendingCompletion, setPendingCompletion] = useState([]);
      const [archivedData, setArchivedData] = useState([]);
      const [showArchivedModal, setShowArchivedModal] = useState(false);
      const [showResetModal, setShowResetModal] = useState(false);
      const [resetCode, setResetCode] = useState('');
      const [lpnInput, setLpnInput] = useState('');
      const [userInput, setUserInput] = useState('');
      const [lpnFilter, setLpnFilter] = useState('');
      const [userFilter, setUserFilter] = useState('');
      const [selectedDate, setSelectedDate] = useState('');
      const [selectedAssignDate, setSelectedAssignDate] = useState('');
      const [showUserModal, setShowUserModal] = useState(false);
      const [showEndModal, setShowEndModal] = useState(false);
      const [showPendingPopup, setShowPendingPopup] = useState(false);
      const [showEditModal, setShowEditModal] = useState(false);
      const [selectedLpn, setSelectedLpn] = useState(null);
      const [selectedEndIndex, setSelectedEndIndex] = useState(null);
      const [selectedEditIndex, setSelectedEditIndex] = useState(null);
      const [completedItems, setCompletedItems] = useState('');
      const [editGroups, setEditGroups] = useState([]);
      const [isAccordionOpen, setIsAccordionOpen] = useState(true);
      const [pendingArchiveData, setPendingArchiveData] = useState(null);
      const [activeTab, setActiveTab] = useState('tracker');

      const lpnInputRef = useRef(null);
      const userInputRef = useRef(null);

      const formatDateToYMD = (dateStr) => {
  if (!dateStr) return '';

  const cleanDate = String(dateStr).trim();

  // If already in DD/MM/YYYY format, keep it
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(cleanDate)) {
    return cleanDate;
  }

  // If already in YYYY-MM-DD format, convert to DD/MM/YYYY
  const isoMatch = cleanDate.match(/^(\d{4})-(\d{2})-(\d{2})$/);

  if (isoMatch) {
    const year = isoMatch[1];
    const month = isoMatch[2];
    const day = isoMatch[3];

    return `${day}/${month}/${year}`;
  }

  // Handle UK format DD/MM/YYYY or DD-MM-YYYY
  const ukMatch = cleanDate.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);

  if (ukMatch) {
    const day = ukMatch[1].padStart(2, '0');
    const month = ukMatch[2].padStart(2, '0');
    const year = ukMatch[3];

    return `${day}/${month}/${year}`;
  }

  // Fallback: return original text if not recognised
  return cleanDate;
};

      useEffect(() => {
        try {
          const savedTrackerData = localStorage.getItem('trackerData');
          const savedPendingCompletion = localStorage.getItem('pendingCompletion');
          const savedCsvData = localStorage.getItem('csvData');
          if (savedTrackerData) {
            setTrackerData(JSON.parse(savedTrackerData));
          }
          if (savedPendingCompletion) {
            setPendingCompletion(JSON.parse(savedPendingCompletion));
          }
          if (savedCsvData) {
            setCsvData(JSON.parse(savedCsvData));
          }
        } catch (error) {
          console.error('Error loading data from localStorage:', error);
          localStorage.clear();
        }
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem('trackerData', JSON.stringify(trackerData));
          localStorage.setItem('pendingCompletion', JSON.stringify(pendingCompletion));
          localStorage.setItem('csvData', JSON.stringify(csvData));
        } catch (error) {
          console.error('Error saving data to localStorage:', error);
        }
      }, [trackerData, pendingCompletion, csvData]);

      // Monitorar o tamanho do trackerData e preparar para arquivamento
      useEffect(() => {
        if (trackerData.length >= 30000) {
          // Ordenar por assignDate para arquivar as entradas mais antigas
          const sortedData = [...trackerData].sort((a, b) => new Date(a.assignDate) - new Date(b.assignDate));
          const toArchive = sortedData.slice(0, 20000); // Pegar as 20.000 mais antigas
          const toKeep = sortedData.slice(20000); // Manter as 10.000 mais recentes

          // Armazenar os dados a serem arquivados e exibir o alerta
          setPendingArchiveData(toArchive);
          alert('O arquivo XLSX com 20.000 linhas está pronto para download. Clique em OK para baixar.');
          
          // Gerar e baixar o arquivo XLSX
          const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
          const filename = `archived_${timestamp}.xlsx`;

          // Preparar os dados para o XLSX
         const wsData = toArchive.map(row => ({
  Date: row.date,
  'Pick Time': row.pickTime || '',
  'Pick User': row.pickUser || '',
  LPN: row.lpn,
  'Tagging User': row.user,
  'Total Items': row.totalItems,
  'Assign Date': row.assignDate,
  'Start Time': row.startTime,
  'End Time': row.endTime,
  'Total Time': row.totalTime,
  Efficiency: row.efficiency,
  'Items / Hour': row.itemsPerHour || '',
}));

          // Criar a planilha
const ws = XLSX.utils.json_to_sheet(wsData);

// Aplicar estilo DHL / Selfridges
applyDhlExcelStyle(ws, wsData, Object.keys(wsData[0] || {}));

          // Criar o workbook e adicionar a planilha
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Tracker Data');

          // Gerar o arquivo XLSX e disparar o download
          XLSX.writeFile(wb, filename);

          // Atualizar o trackerData para manter apenas as 10.000 linhas
          setTrackerData(toKeep);
          setPendingArchiveData(null);
        }
      }, [trackerData]);

      useEffect(() => {
        const interval = setInterval(() => {
          if (pendingCompletion.length > 0) {
            setShowPendingPopup(true);
          }
        }, 60000);
        return () => clearInterval(interval);
      }, [pendingCompletion]);

      useEffect(() => {
        if (lpnInputRef.current) {
          lpnInputRef.current.focus();
        }
      }, []);

      useEffect(() => {
        if (showUserModal && userInputRef.current) {
          userInputRef.current.focus();
        }
      }, [showUserModal]);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        Papa.parse(file, {
          header: true,
          complete: (result) => {
            const validData = result.data
              .filter(row => row.LPN && row.LPN.trim() !== '')
              .map(row => ({
  ...row,
  Date: formatDateToYMD(row.Date || ''),
  PickTime: row['Pick Time'] || row.PickTime || '',
  PickUser: row['Pick User'] || row.PickUser || '',
}));
            setCsvData(validData);
          },
          error: (error) => {
            console.error('Error parsing CSV:', error);
            alert('Failed to parse CSV file. Please check the file format.');
          },
        });
      };

      const handleResetAllData = () => {
        setShowResetModal(true);
      };

      const confirmResetAllData = () => {
        if (resetCode === 'abcd@1234') {
          setCsvData([]);
          setTrackerData([]);
          setPendingCompletion([]);
          setArchivedData([]);
          setLpnInput('');
          setUserInput('');
          setLpnFilter('');
          setUserFilter('');
          setSelectedDate('');
          setSelectedAssignDate('');
          localStorage.clear();
          setShowResetModal(false);
          setResetCode('');
        } else {
          alert('Código de segurança incorreto. Tente novamente.');
          setResetCode('');
        }
      };

      const handleLpnScan = (e) => {
        e.preventDefault();
        const lpn = lpnInput.trim();
        if (!lpn) return;

        const pendingRecord = pendingCompletion.find((row) => row.lpn === lpn);
        const trackerRecords = trackerData.filter((row) => row.lpn === lpn);
        const openRecord = trackerRecords.some((row) => !row.endTime);

        if (openRecord) {
          alert('This LPN is already assigned and in progress!');
          return;
        }

        if (pendingRecord) {
          setSelectedLpn({
  Date: pendingRecord.date,
  PickTime: pendingRecord.pickTime || '',
  PickUser: pendingRecord.pickUser || '',
  LPN: pendingRecord.lpn,
  ...pendingRecord.groups.reduce((acc, group) => {
    acc[group.group] = group.qty;
    return acc;
  }, {}),
});
          setShowUserModal(true);
          return;
        }

        const csvRecord = csvData.find((row) => row.LPN === lpn);
        if (!csvRecord) {
          alert('LPN not found in the CSV');
          return;
        }

        const totalItemsCsv = Object.keys(csvRecord)
          .filter((key) => !isNaN(key) && csvRecord[key])
          .reduce((sum, key) => sum + parseInt(csvRecord[key] || 0), 0);

        const totalCompleted = trackerRecords
          .filter((entry) => entry.endTime)
          .reduce((sum, entry) => sum + (entry.totalItems || 0), 0);

        if (totalCompleted >= totalItemsCsv && !pendingRecord) {
          alert('LPN already fully completed!');
          return;
        }

        setSelectedLpn(csvRecord);
        setShowUserModal(true);
      };

      const handleAssignUser = () => {
        if (!userInput.trim()) {
          alert('Please enter a user name to assign the LPN!');
          return;
        }

        const pendingRecord = pendingCompletion.find((row) => row.lpn === selectedLpn?.LPN);
        let totalItems, groups;
        
        if (pendingRecord) {
          totalItems = pendingRecord.totalItems || 0;
          groups = pendingRecord.groups || [];
          setPendingCompletion(pendingCompletion.filter((row) => row.lpn !== selectedLpn.LPN));
        } else {
          totalItems = Object.keys(selectedLpn)
            .filter((key) => !isNaN(key) && selectedLpn[key])
            .reduce((sum, key) => sum + parseInt(selectedLpn[key] || 0), 0);
          groups = Object.keys(selectedLpn)
            .filter((key) => !isNaN(key) && selectedLpn[key])
            .map((key) => ({ group: key, qty: parseInt(selectedLpn[key]) }));
        }

const newEntry = {
  date: selectedLpn.Date || '',
  pickTime: selectedLpn.PickTime || selectedLpn['Pick Time'] || '',
  pickUser: selectedLpn.PickUser || selectedLpn['Pick User'] || '',
  lpn: selectedLpn.LPN || '',
  user: userInput,
  groups,
  totalItems,
  originalTotalItems: totalItems,
  completionStatus: 'open',
  assignDate: new Date().toISOString().split('T')[0],
  startTime: getCurrentTimeString(),
  endTime: '',
  totalTime: '',
  efficiency: '',
itemsPerHour: '',
};
        setTrackerData([...trackerData, newEntry]);
        setShowUserModal(false);
        setLpnInput('');
        setUserInput('');
      };

      const handleCancelAssign = () => {
        setShowUserModal(false);
        setLpnInput('');
        setUserInput('');
      };
const getCurrentTimeString = () => {
  const now = new Date();

  const hours = now.getHours().toString().padStart(2, '0');
  const minutes = now.getMinutes().toString().padStart(2, '0');
  const seconds = now.getSeconds().toString().padStart(2, '0');

  return `${hours}:${minutes}:${seconds}`;
};

const parseTimeToSeconds = (timeValue) => {
  if (!timeValue) return null;

  let timeText = String(timeValue).trim();

  if (!timeText) return null;

  const amPmMatch = timeText.match(/\s?(AM|PM)$/i);
  let isPM = false;
  let isAM = false;

  if (amPmMatch) {
    isPM = amPmMatch[1].toUpperCase() === 'PM';
    isAM = amPmMatch[1].toUpperCase() === 'AM';
    timeText = timeText.replace(/\s?(AM|PM)$/i, '').trim();
  }

  const parts = timeText.split(':').map((part) => parseInt(part, 10));

  if (parts.length < 2 || parts.some((part) => isNaN(part))) {
    return null;
  }

  let hours = parts[0];
  const minutes = parts[1];
  const seconds = parts[2] || 0;

  if (isPM && hours < 12) {
    hours += 12;
  }

  if (isAM && hours === 12) {
    hours = 0;
  }

  return (hours * 3600) + (minutes * 60) + seconds;
};

const formatSecondsToHHMMSS = (totalSeconds) => {
  if (totalSeconds === null || totalSeconds === undefined || isNaN(totalSeconds)) {
    return '';
  }

  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
};
      const initiateEndTagging = (entry) => {
  const realIndex = trackerData.findIndex((row) =>
    row.lpn === entry.lpn &&
    row.assignDate === entry.assignDate &&
    row.startTime === entry.startTime &&
    !row.endTime
  );

  if (realIndex === -1) {
    alert('This LPN could not be found as an open record. Please refresh or check the tracker data.');
    return;
  }

  setSelectedEndIndex(realIndex);
  setCompletedItems(trackerData[realIndex]?.totalItems?.toString() || '');
  setShowEndModal(true);
};

      const handleEndTagging = () => {
        const updatedData = [...trackerData];
const entry = updatedData[selectedEndIndex];
const completed = parseInt(completedItems);
const total = entry.totalItems || 0;
const originalTotal = entry.originalTotalItems || total;

if (isNaN(completed) || completed < 0 || completed > total) {
  alert('Please enter a valid number of completed items.');
  return;
}

entry.originalTotalItems = originalTotal;
entry.totalItems = completed;
entry.endDate = new Date().toISOString().split('T')[0];
entry.endTime = getCurrentTimeString();

if (completed < total) {
  entry.completionStatus = 'partial';
} else {
  entry.completionStatus = 'completed';
}

const startSeconds = parseTimeToSeconds(entry.startTime);
const endSeconds = parseTimeToSeconds(entry.endTime);

if (startSeconds === null || endSeconds === null) {
  entry.totalTime = '';
  entry.efficiency = '';
} else {
  let diffSec = endSeconds - startSeconds;

  if (diffSec < 0) {
    diffSec += 24 * 60 * 60;
  }

  entry.totalTime = formatSecondsToHHMMSS(diffSec);

  const diffHrs = diffSec / 3600;

  if (diffHrs > 0) {
  const itemsPerHour = completed / diffHrs;

  // Original efficiency logic preserved
  entry.efficiency = `${((itemsPerHour / 60) * 100).toFixed(2)}%`;

  // New productivity metric
  entry.itemsPerHour = `${Math.round(itemsPerHour)} items/h`;
} else {
  entry.efficiency = '';
  entry.itemsPerHour = '';
}
}

        if (completed < total) {
          const remainingItems = total - completed;
          const ratio = remainingItems / total;
          const newGroups = (entry.groups || []).map((group) => ({
            group: group.group,
            qty: Math.round(group.qty * ratio),
          })).filter((group) => group.qty > 0);

          const pendingEntry = {
  date: entry.date,
  pickTime: entry.pickTime || '',
  pickUser: entry.pickUser || '',
  lpn: entry.lpn,
  groups: newGroups,
  totalItems: remainingItems,
};
          setPendingCompletion([...pendingCompletion, pendingEntry]);
        }

        setTrackerData(updatedData);
        setShowEndModal(false);
        setCompletedItems('');
      };

      const initiateEditPending = (index) => {
        setSelectedEditIndex(index);
        setEditGroups((pendingCompletion[index]?.groups || []).map((group) => ({ ...group })));
        setShowEditModal(true);
      };

      const handleEditPending = () => {
        const updatedPending = [...pendingCompletion];
        const totalItems = editGroups.reduce((sum, group) => sum + (group.qty || 0), 0);
        if (totalItems <= 0) {
          alert('Total items must be greater than 0.');
          return;
        }
        updatedPending[selectedEditIndex] = {
          ...updatedPending[selectedEditIndex],
          groups: editGroups,
          totalItems: totalItems,
        };
        setPendingCompletion(updatedPending);
        setShowEditModal(false);
      };

      

const applyDhlExcelStyle = (ws, dataRows, headerKeys) => {
  if (!ws || !headerKeys || headerKeys.length === 0) return;
  if (!ws['!ref']) return;

  const range = XLSX.utils.decode_range(ws['!ref']);

  // ======================================================
  // PREMIUM HEADER STYLE
  // Dark graphite background + soft gold font
  // This gives a premium DHL / Selfridges look without copying
  // the same exact colours from the other report.
  // ======================================================
  const headerStyle = {
    font: {
      bold: true,
      color: { rgb: 'F9D65C' }, // premium gold
    },
    fill: {
      fgColor: { rgb: '1F2933' }, // dark graphite
    },
    alignment: {
      horizontal: 'center',
      vertical: 'center',
      wrapText: true,
    },
    border: {
      top: { style: 'thin', color: { rgb: '111827' } },
      bottom: { style: 'thin', color: { rgb: 'D40511' } }, // subtle DHL red line
      left: { style: 'thin', color: { rgb: '111827' } },
      right: { style: 'thin', color: { rgb: '111827' } },
    },
  };

  // ======================================================
  // NORMAL DATA STYLE
  // Clean white rows with light borders
  // ======================================================
  const normalStyle = {
    alignment: {
      horizontal: 'center',
      vertical: 'center',
      wrapText: true,
    },
    border: {
      top: { style: 'thin', color: { rgb: 'E5E7EB' } },
      bottom: { style: 'thin', color: { rgb: 'E5E7EB' } },
      left: { style: 'thin', color: { rgb: 'E5E7EB' } },
      right: { style: 'thin', color: { rgb: 'E5E7EB' } },
    },
  };

  // ======================================================
  // ZEBRA ROW STYLE
  // Soft champagne yellow, less aggressive than DHL yellow
  // ======================================================
  const zebraStyle = {
    ...normalStyle,
    fill: {
      fgColor: { rgb: 'FFF7D6' }, // soft champagne yellow
    },
  };

  // ======================================================
  // EXCEPTION STYLE
  // Used when the cell text indicates a problem / risk
  // ======================================================
  const exceptionStyle = {
    ...normalStyle,
    fill: {
      fgColor: { rgb: 'FDE2E2' }, // soft red
    },
    font: {
      color: { rgb: '991B1B' }, // dark red text
      bold: true,
    },
  };

  // ======================================================
  // HEADER ROW FORMAT
  // Applies the same premium header style to all columns
  // ======================================================
  for (let C = range.s.c; C <= range.e.c; C++) {
    const cellRef = XLSX.utils.encode_cell({ r: 0, c: C });

    if (!ws[cellRef]) continue;

    ws[cellRef].s = headerStyle;
  }

  // ======================================================
  // DATA ROW FORMAT
  // Applies zebra style and highlights exceptions
  // ======================================================
  for (let R = 1; R <= range.e.r; R++) {
    for (let C = range.s.c; C <= range.e.c; C++) {
      const cellRef = XLSX.utils.encode_cell({ r: R, c: C });

      if (!ws[cellRef]) continue;

      const cellText = String(ws[cellRef].v || '').toLowerCase();

      if (
        cellText.includes('over 24h') ||
        cellText.includes('urgent') ||
        cellText.includes('review required') ||
        cellText.includes('> 7 days') ||
        cellText.includes('> 24h') ||
        cellText.includes('pending completion')
      ) {
        ws[cellRef].s = exceptionStyle;
      } else {
        ws[cellRef].s = R % 2 === 0 ? zebraStyle : normalStyle;
      }
    }
  }

  // ======================================================
  // AUTO FILTER
  // Adds filter arrows to the header row
  // ======================================================
  ws['!autofilter'] = {
    ref: XLSX.utils.encode_range(range),
  };

  // ======================================================
  // IMPROVED COLUMN WIDTHS
  // This is not real Excel AutoFit, but it calculates a better
  // width based on the header and the content in each column.
  //
  // Previous version:
  // min width: 12
  // max width: 35
  //
  // New version:
  // min width: 14
  // max width: 55
  //
  // This helps avoid squeezed columns.
  // ======================================================
  ws['!cols'] = headerKeys.map((key) => {
    const maxLength = Math.max(
      key.length,
      ...dataRows.map(row => (row[key] || '').toString().length)
    );

    return {
      wch: Math.min(Math.max(maxLength + 4, 14), 55),
    };
  });

  // ======================================================
  // HEADER ROW HEIGHT
  // Gives breathing room when headers wrap text
  // ======================================================
  ws['!rows'] = ws['!rows'] || [];
  ws['!rows'][0] = { hpt: 28 };
};
const parseExcelDate = (value) => {
  if (!value) return null;

  const text = String(value).trim();

  // DD/MM/YYYY
  const ukMatch = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (ukMatch) {
    const day = parseInt(ukMatch[1], 10);
    const month = parseInt(ukMatch[2], 10) - 1;
    const year = parseInt(ukMatch[3], 10);
    return new Date(year, month, day);
  }

  // YYYY-MM-DD
  const isoMatch = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (isoMatch) {
    const year = parseInt(isoMatch[1], 10);
    const month = parseInt(isoMatch[2], 10) - 1;
    const day = parseInt(isoMatch[3], 10);
    return new Date(year, month, day);
  }

  return null;
};

const applyDateColumns = (ws, headerKeys, dateHeaders) => {
  if (!ws || !ws['!ref']) return;

  const range = XLSX.utils.decode_range(ws['!ref']);

  dateHeaders.forEach((headerName) => {
    const colIndex = headerKeys.indexOf(headerName);

    if (colIndex === -1) return;

    for (let R = 1; R <= range.e.r; R++) {
      const cellRef = XLSX.utils.encode_cell({ r: R, c: colIndex });
      const cell = ws[cellRef];

      if (!cell || !cell.v) continue;

      const parsedDate = parseExcelDate(cell.v);

      if (parsedDate) {
        cell.t = 'd';
        cell.v = parsedDate;
        cell.z = 'dd/mm/yyyy';
      }
    }
  });
};

const getStoreFromLpn = (lpn) => {
  const prefix = String(lpn || '').substring(0, 2).toUpperCase();

  if (prefix === 'OX') return 'OXFORD';
  if (prefix === 'BR') return 'BIRMINGHAM';
  if (prefix === 'TR') return 'TRAFFORD';
  if (prefix === 'ME') return 'EXCHANGE';

  return 'UNKNOWN';
};

const parseItemsPerHourNumber = (value) => {
  if (!value) return 0;

  const match = String(value).match(/[\d.]+/);
  return match ? parseFloat(match[0]) : 0;
};

const parseEfficiencyNumber = (value) => {
  if (!value) return 0;

  const match = String(value).match(/[\d.]+/);
  return match ? parseFloat(match[0]) : 0;
};

const parseTotalTimeToSeconds = (value) => {
  if (!value) return 0;

  const parts = String(value).split(':').map(part => parseInt(part, 10));

  if (parts.length !== 3 || parts.some(isNaN)) return 0;

  return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
};

const formatSecondsToTimeText = (seconds) => {
  if (!seconds || isNaN(seconds)) return '';

  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);

  return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
};

const getAverage = (values) => {
  const cleanValues = values.filter(value => value !== null && value !== undefined && !isNaN(value));

  if (cleanValues.length === 0) return 0;

  return cleanValues.reduce((sum, value) => sum + value, 0) / cleanValues.length;
};

const createStyledSheet = (wb, sheetName, dataRows, dateHeaders = []) => {
  const ws = XLSX.utils.json_to_sheet(dataRows);
  const headerKeys = Object.keys(dataRows[0] || {});

  applyDhlExcelStyle(ws, dataRows, headerKeys);
  applyDateColumns(ws, headerKeys, dateHeaders);

  XLSX.utils.book_append_sheet(wb, ws, sheetName);

  return ws;
};

const buildStoreAnalysisRows = (summaryRows) => {
  const storeMap = {};

  summaryRows.forEach(row => {
    const store = getStoreFromLpn(row.lpn);

    if (!storeMap[store]) {
      storeMap[store] = {
        Store: store,
        LPNs: 0,
        Qty: 0,
        Completed: 0,
        Open: 0,
        Partial: 0,
        'Over 24h': 0,
        'Not Started': 0,
      };
    }

    storeMap[store].LPNs += 1;
    storeMap[store].Qty += parseInt(row.qty || 0, 10);

    if (row.status === 'Completed') storeMap[store].Completed += 1;
    else if (row.status === 'Open') storeMap[store].Open += 1;
    else if (row.status === 'Partial') storeMap[store].Partial += 1;
    else if (row.status === 'Over 24h') storeMap[store]['Over 24h'] += 1;
    else if (row.status === 'Not Started') storeMap[store]['Not Started'] += 1;
  });

  const totalQty = Object.values(storeMap).reduce((sum, row) => sum + row.Qty, 0);

  return Object.values(storeMap).map(row => ({
    ...row,
    'Qty Share': totalQty > 0 ? `${((row.Qty / totalQty) * 100).toFixed(1)}%` : '0%',
    'Visual Bar': '█'.repeat(Math.min(30, Math.round((row.Qty / Math.max(totalQty, 1)) * 30))),
  }));
};

const buildUserPerformanceRows = (trackerData) => {
  const userMap = {};

  trackerData.forEach(row => {
    const user = row.user || 'Unknown';

    if (!userMap[user]) {
      userMap[user] = {
        User: user,
        'LPNs Worked': 0,
        'Completed LPNs': 0,
        'Partial LPNs': 0,
        'Qty Processed': 0,
        itemsPerHourValues: [],
        efficiencyValues: [],
        timeValues: [],
      };
    }

    userMap[user]['LPNs Worked'] += 1;
    userMap[user]['Qty Processed'] += parseInt(row.totalItems || 0, 10);

    if (row.completionStatus === 'completed') userMap[user]['Completed LPNs'] += 1;
    if (row.completionStatus === 'partial') userMap[user]['Partial LPNs'] += 1;

    const iph = parseItemsPerHourNumber(row.itemsPerHour);
    const eff = parseEfficiencyNumber(row.efficiency);
    const timeSeconds = parseTotalTimeToSeconds(row.totalTime);

    if (iph > 0) userMap[user].itemsPerHourValues.push(iph);
    if (eff > 0) userMap[user].efficiencyValues.push(eff);
    if (timeSeconds > 0) userMap[user].timeValues.push(timeSeconds);
  });

  return Object.values(userMap).map(row => ({
    User: row.User,
    'LPNs Worked': row['LPNs Worked'],
    'Completed LPNs': row['Completed LPNs'],
    'Partial LPNs': row['Partial LPNs'],
    'Qty Processed': row['Qty Processed'],
    'Avg Items / Hour': Math.round(getAverage(row.itemsPerHourValues)),
    'Avg Efficiency': `${getAverage(row.efficiencyValues).toFixed(2)}%`,
    'Avg Total Time': formatSecondsToTimeText(getAverage(row.timeValues)),
  })).sort((a, b) => b['Qty Processed'] - a['Qty Processed']);
};

const buildExceptionsRows = (summaryRows, pendingCompletion) => {
  const summaryExceptions = summaryRows
    .filter(row => row.status !== 'Completed')
    .map(row => ({
      Type: row.status,
      Date: row.date,
      'Pick Time': row.pickTime || '',
      'Pick User': row.pickUser || '',
      LPN: row.lpn,
      Qty: row.qty,
      Groups: row.groups,
      'Tagging User': row.taggingUser || '',
      'Age Hours': formatAgeHoursWithDays(row.ageHours),
      Action: row.status === 'Over 24h'
        ? 'Urgent review required'
        : row.status === 'Partial'
          ? 'Pending remaining quantity'
          : row.status === 'Open'
            ? 'Currently in progress'
            : 'Not yet started',
    }));

  const pendingRows = pendingCompletion.map(row => ({
    Type: 'Pending Completion',
    Date: row.date || '',
    'Pick Time': row.pickTime || '',
    'Pick User': row.pickUser || '',
    LPN: row.lpn,
    Qty: row.totalItems,
    Groups: (row.groups || []).map(group => group.group).join(', '),
    'Tagging User': '',
    'Age Hours': '',
    Action: 'Complete remaining quantity',
  }));

  return [...summaryExceptions, ...pendingRows];
};
const getCsvAgeHoursFromRow = (row) => {
  const pickDateTime = buildDateTime(
    row.date || row.Date || '',
    row.pickTime || row.PickTime || row['Pick Time'] || ''
  );

  if (!pickDateTime) return null;

  const diffMs = new Date() - pickDateTime;

  if (diffMs < 0) return null;

  return diffMs / (1000 * 60 * 60);
};

const getCsvRiskLevel = (ageHours) => {
  if (ageHours === null || ageHours === undefined || isNaN(ageHours)) {
    return 'Unknown';
  }

  if (ageHours > 168) {
    return 'Critical > 7 days';
  }

  if (ageHours > 24) {
    return 'Attention > 24h';
  }

  return 'OK <= 24h';
};

const getCsvPossibleCause = (riskLevel) => {
  if (riskLevel === 'Critical > 7 days') {
    return 'Check if LPN was missed, sent without tagging, or not transferred to tagging area';
  }

  if (riskLevel === 'Attention > 24h') {
    return 'Review tagging queue and confirm physical location';
  }

  if (riskLevel === 'OK <= 24h') {
    return 'Within expected window';
  }

  return 'Pick date/time missing or invalid';
};

const buildCsvAgingDetailRows = (summaryRows) => {
  return summaryRows.map(row => {
    const csvAgeHours = getCsvAgeHoursFromRow(row);
    const riskLevel = getCsvRiskLevel(csvAgeHours);

    return {
      Date: row.date,
      'Pick Time': row.pickTime || '',
      'Pick User': row.pickUser || '',
      LPN: row.lpn,
      Store: getStoreFromLpn(row.lpn),
      Qty: row.qty,
      Groups: row.groups,
      Status: row.status,
      'CSV Age': formatAgeHoursWithDays(csvAgeHours),
      'CSV Age Hours': csvAgeHours !== null ? Number(csvAgeHours.toFixed(1)) : '',
      'Risk Level': riskLevel,
      'Possible Cause': getCsvPossibleCause(riskLevel),
    };
  }).sort((a, b) => {
    const ageA = parseFloat(a['CSV Age Hours']) || 0;
    const ageB = parseFloat(b['CSV Age Hours']) || 0;

    return ageB - ageA;
  });
};

const buildCsvAgingByStoreRows = (summaryRows) => {
  const detailRows = buildCsvAgingDetailRows(summaryRows);

  const stores = ['OXFORD', 'BIRMINGHAM', 'TRAFFORD', 'EXCHANGE'];

  return stores.map(store => {
    const storeRows = detailRows.filter(row => row.Store === store);

    const over24Rows = storeRows.filter(row => {
      const age = parseFloat(row['CSV Age Hours']) || 0;
      return age > 24;
    });

    const over7DaysRows = storeRows.filter(row => {
      const age = parseFloat(row['CSV Age Hours']) || 0;
      return age > 168;
    });

    const oldestRow = storeRows
      .slice()
      .sort((a, b) => {
        const ageA = parseFloat(a['CSV Age Hours']) || 0;
        const ageB = parseFloat(b['CSV Age Hours']) || 0;

        return ageB - ageA;
      })[0];

    let riskLevel = 'OK';
    let operationalNote = 'Within expected window';

    if (over7DaysRows.length > 0) {
      riskLevel = 'Critical';
      operationalNote = 'Critical review required: check missed LPNs, possible dispatch without tagging, or gap between Pick and Tagging.';
    } else if (over24Rows.length > 0) {
      riskLevel = 'Attention';
      operationalNote = 'Review tagging queue and physical location: LPNs are older than 24h from Pick Date/Time.';
    }

    return {
      Store: store,
      'Total LPNs': storeRows.length,
      'Total Qty': storeRows.reduce((sum, row) => sum + (parseInt(row.Qty, 10) || 0), 0),
      '>24h LPNs': over24Rows.length,
      '>24h Qty': over24Rows.reduce((sum, row) => sum + (parseInt(row.Qty, 10) || 0), 0),
      '>7 Days LPNs': over7DaysRows.length,
      '>7 Days Qty': over7DaysRows.reduce((sum, row) => sum + (parseInt(row.Qty, 10) || 0), 0),
      'Oldest LPN': oldestRow ? oldestRow.LPN : '',
      'Oldest Age': oldestRow ? oldestRow['CSV Age'] : '',
      'Risk Level': riskLevel,
      'Operational Note': operationalNote,
    };
  });
};

const buildDateTime = (dateValue, timeValue) => {
  if (!dateValue || !timeValue) return null;

  const cleanDate = String(dateValue).trim();
  const cleanTime = String(timeValue).trim().length === 5
    ? `${String(timeValue).trim()}:00`
    : String(timeValue).trim();

  // UK format DD/MM/YYYY
  const ukMatch = cleanDate.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);

  if (ukMatch) {
    const day = ukMatch[1].padStart(2, '0');
    const month = ukMatch[2].padStart(2, '0');
    const year = ukMatch[3];

    const dateTime = new Date(`${year}-${month}-${day}T${cleanTime}`);
    return isNaN(dateTime) ? null : dateTime;
  }

  // ISO format YYYY-MM-DD
  const isoMatch = cleanDate.match(/^(\d{4})-(\d{2})-(\d{2})$/);

  if (isoMatch) {
    const dateTime = new Date(`${cleanDate}T${cleanTime}`);
    return isNaN(dateTime) ? null : dateTime;
  }

  return null;
};

const getAgeHours = (entry) => {
  const pickDateTime = getPickDateTime(entry);
  if (!pickDateTime) return null;

  const endDateTime = entry.endTime ? getEndDateTime(entry) : null;
  const finalDateTime = endDateTime || new Date();

  const diffMs = finalDateTime - pickDateTime;

  if (diffMs < 0) return null;

  return diffMs / (1000 * 60 * 60);
};

const formatAgeHoursWithDays = (hours) => {
  if (hours === null || hours === undefined || isNaN(hours)) return '';

  const days = hours / 24;
  const roundedDays = Math.round(days);

  if (hours < 24) {
    return `${hours.toFixed(1)} hrs`;
  }

  return `${hours.toFixed(1)} hrs · ${roundedDays}d`;
};

const getLpnStatus = (csvRow) => {
  const lpn = csvRow.LPN || '';
  const totalQtyFromCsv = getCsvTotalQty(csvRow);

  const trackerRecordsForLpn = trackerData.filter((entry) => entry.lpn === lpn);
  const pendingRecord = pendingCompletion.find((entry) => entry.lpn === lpn);

  if (trackerRecordsForLpn.length === 0 && !pendingRecord) {
    return 'Not Started';
  }

  const openRecord = trackerRecordsForLpn.find((entry) => !entry.endTime);

  if (openRecord) {
    const ageHours = getAgeHours(openRecord);

    if (ageHours !== null && ageHours > 24) {
      return 'Over 24h';
    }

    return 'Open';
  }

  const completedQty = trackerRecordsForLpn
    .filter((entry) => entry.endTime)
    .reduce((sum, entry) => sum + (parseInt(entry.totalItems) || 0), 0);

  if (completedQty >= totalQtyFromCsv && totalQtyFromCsv > 0) {
    return 'Completed';
  }

  if (pendingRecord || completedQty > 0) {
    return 'Partial';
  }

  return 'Not Started';
};

const reportLpns = csvData.filter((row) => row.LPN);
const reportLpnCount = reportLpns.length;

const startedLpnSet = new Set(trackerData.map((entry) => entry.lpn).filter(Boolean));

const notStartedRecords = reportLpns.filter((row) => !startedLpnSet.has(row.LPN));

const openRecords = trackerData.filter((entry) => !entry.endTime);

const over24Records = openRecords.filter((entry) => {
  const ageHours = getAgeHours(entry);
  return ageHours !== null && ageHours > 24;
});

const completedRecords = trackerData.filter((entry) => entry.endTime && entry.completionStatus === 'completed');
const partialRecords = trackerData.filter((entry) => entry.completionStatus === 'partial');

const totalReportQty = reportLpns.reduce((sum, row) => sum + getCsvTotalQty(row), 0);

const over24Qty = over24Records.reduce((sum, entry) => sum + (entry.totalItems || 0), 0);

const oldestOpenRecord = openRecords
  .map((entry) => ({
    ...entry,
    ageHours: getAgeHours(entry),
  }))
  .filter((entry) => entry.ageHours !== null)
  .sort((a, b) => b.ageHours - a.ageHours)[0];

const summaryRows = reportLpns.map((row) => {
  const lpn = row.LPN || '';
  const trackerRecordsForLpn = trackerData.filter((entry) => entry.lpn === lpn);
  const latestRecord = trackerRecordsForLpn[trackerRecordsForLpn.length - 1];

  const status = getLpnStatus(row);

  const latestClosedRecord = trackerRecordsForLpn
    .filter((entry) => entry.endTime)
    .slice()
    .sort((a, b) => {
      const aEnd = getEndDateTime(a);
      const bEnd = getEndDateTime(b);

      if (!aEnd && !bEnd) return 0;
      if (!aEnd) return 1;
      if (!bEnd) return -1;

      return bEnd - aEnd;
    })[0];

  const ageHours =
    status === 'Completed' && latestClosedRecord
      ? getAgeHours({
          ...latestClosedRecord,
          date: row.Date,
          pickTime: row.PickTime || row['Pick Time'],
        })
      : getAgeHours({
          date: row.Date,
          pickTime: row.PickTime || row['Pick Time'],
        });

  return {
    date: row.Date || '',
    pickTime: row.PickTime || row['Pick Time'] || '',
    pickUser: row.PickUser || row['Pick User'] || '',
    lpn,
    qty: getCsvTotalQty(row),
    groups: getCsvGroupsText(row),
    taggingUser: latestRecord?.user || '',
    status,
    ageHours,
  };
}).sort((a, b) => {
  const aCompleted = a.status === 'Completed';
  const bCompleted = b.status === 'Completed';

  // Keep active/problematic LPNs above completed ones
  if (aCompleted && !bCompleted) return 1;
  if (!aCompleted && bCompleted) return -1;

  // Oldest first = highest ageHours first
  const ageA = a.ageHours ?? -1;
  const ageB = b.ageHours ?? -1;

  return ageB - ageA;
});

const getEndTaggingButtonStyle = (entry) => {

    };

  if (entry.completionStatus === 'partial') {

    };

  return {

    background: 'linear-gradient(145deg, #22c55e, #15803d)', // Green - Completed
  };
};

const getTrackerGroupsText = (entry) => {

                        style={{ backgroundColor: '#000000', color: '#FFD700', borderRadius: '8px' }}
                      >
                        Cancel
                      </button>
                      <button
                        onClick={handleAssignUser}
                        className="p-2 rounded text-white shadow-md hover:shadow-lg transition-shadow duration-200"
                        style={{ backgroundColor: '#D40511', borderRadius: '8px' }}
                      >
                        Assign
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {showEndModal && (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                  <div className="bg-white p-6 rounded shadow-lg">
                    <h2 className="text-xl mb-4">End Tagging for LPN: {trackerData[selectedEndIndex]?.lpn || ''}</h2>
                    <p className="mb-2">Total Items: {trackerData[selectedEndIndex]?.totalItems || 0}</p>
                    <input
                      type="number"
                      placeholder="Enter completed items"
                      value={completedItems}
                      onChange={(e) => setCompletedItems(e.target.value)}
                      className="p-2 border rounded w-full mb-4"
                    />
                    <div className="flex justify-end space-x-4">
                      <button
                        onClick={() => setShowEndModal(false)}
                        className="p-2 rounded shadow-md hover:shadow-lg transition-shadow duration-200"
                        style={{ backgroundColor: '#000000', color: '#FFD700', borderRadius: '8px' }}
                      >
                        Cancel
                      </button>
                      <button
                        onClick={handleEndTagging}
                        className="p-2 rounded text-white shadow-lg hover:shadow-xl transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0.5"
                        style={{
                          background: 'linear-gradient(145deg, #ff3333, #cc0000)',
                          borderRadius: '8px',
                          boxShadow: '3px 3px 8px rgba(0, 0, 0, 0.3), -3px -3px 8px rgba(255, 255, 249, 0.3)',
                        }}
                      >
                        Confirm
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {showEditModal && (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                  <div className="bg-white p-6 rounded shadow-lg">
                    <h2 className="text-xl mb-4">Edit LPN: {pendingCompletion[selectedEditIndex]?.lpn || ''}</h2>
                    {editGroups.map((group, index) => (
                      <div key={index} className="flex items-center space-x-2 mb-2">
                        <label>Group {group.group}:</label>
                        <input
                          type="number"
                          value={group.qty || 0}
                          onChange={(e) => {
                            const updatedGroups = [...editGroups];
                            updatedGroups[index].qty = parseInt(e.target.value) || 0;
                            setEditGroups(updatedGroups);
                          }}
                          className="p-1 border rounded w-20"
                        />
                      </div>
                    ))}
                    <p className="mb-4">
                      Total Remaining: {editGroups.reduce((sum, group) => sum + (group.qty || 0), 0)}
                    </p>
                    <div className="flex justify-end space-x-4">
                      <button
                        onClick={() => setShowEditModal(false)}
                        className="p-2 rounded shadow-md hover:shadow-lg transition-shadow duration-200"
                        style={{ backgroundColor: '#000000', color: '#FFD700', borderRadius: '8px' }}
                      >
                        Cancel
                      </button>
                      <button
                        onClick={handleEditPending}
                        className="p-2 rounded text-white shadow-md hover:shadow-lg transition-shadow duration-200"
                        style={{ backgroundColor: '#D40511', borderRadius: '8px' }}
                      >
                        Save
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {showPendingPopup && (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                  <div className="bg-white p-6 rounded shadow-lg">
                    <h2 className="text-xl mb-4">Pending Completion LPNs</h2>
                    {pendingCompletion.map((entry, index) => (
                      <p key={index} className="mb-2 text-sm">
                        LPN: {entry.lpn} - <span className="font-bold">Remaining:</span> {entry.totalItems}
                      </p>
                    ))}
                    <div className="flex justify-end">
                      <button
                        onClick={() => setShowPendingPopup(false)}
                        className="p-2 rounded text-white shadow-md hover:shadow-lg transition-shadow duration-200"
                        style={{ backgroundColor: '#D40511', borderRadius: '8px' }}
                      >
                        Close
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {showArchivedModal && (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                  <div className="bg-white p-6 rounded shadow-lg w-3/4 max-h-[80vh] overflow-y-auto">
                    <h2 className="text-xl mb-4">Archived Data</h2>
                    <div className="mb-4">
                      <input
                        type="file"
                        accept=".xlsx"
                        onChange={handleLoadArchivedFile}
                        className="p-2 border rounded w-full"
                      />
                    </div>
                    {archivedData.length > 0 && (
                      <div className="table-container">
                        <table className="w-full border-collapse">
                          <thead className="sticky-header">
  <tr>
    <th className="py-1 px-2 border">Date</th>
    <th className="py-1 px-2 border">LPN</th>
    <th className="py-1 px-2 border">User</th>
    <th className="py-1 px-2 border">Total Items</th>
    <th className="py-1 px-2 border">Assign Date</th>
    <th className="py-1 px-2 border">Start Time</th>
    <th className="py-1 px-2 border">End Time</th>
    <th className="py-1 px-2 border">Total Time</th>
    <th className="py-1 px-2 border">Efficiency</th>
    <th className="py-1 px-2 border">Actions</th>
  </tr>
</thead>
                          <tbody>
                            {filteredArchivedData.map((entry, index) => (
                              <tr key={index} style={{ backgroundColor: index % 2 === 0 ? '#FFD700' : '#FFFFFF' }}>
                                <td className="py-0.5 px-1 border text-sm">{entry.date}</td>
                                <td className="py-0.5 px-1 border text-sm">{entry.lpn}</td>
                                <td className="py-0.5 px-1 border text-sm">{entry.user}</td>
                                <td className="py-0.5 px-1 border text-sm">{entry.totalItems}</td>
                                <td className="py-0.5 px-1 border text-sm">{entry.assignDate}</td>
                                <td className="py-0.5 px-1 border text-sm">{entry.startTime}</td>
                                <td className="py-0.5 px-1 border text-sm">{entry.endTime}</td>
                                <td className="py-0.5 px-1 border text-sm">{entry.totalTime}</td>
                                <td className="py-0.5 px-1 border text-sm">{entry.efficiency}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                    <div className="flex justify-end mt-4">
                      <button
                        onClick={() => {
                          setShowArchivedModal(false);
                          setArchivedData([]);
                        }}
                        className="p-2 rounded text-white shadow-md hover:shadow-lg transition-shadow duration-200"
                        style={{ backgroundColor: '#D40511', borderRadius: '8px' }}
                      >
                        Close
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {showResetModal && (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                  <div className="bg-white p-6 rounded shadow-lg">
                    <h2 className="text-xl mb-4">Confirm Reset All Data</h2>
                    <p className="mb-4">Enter the security code to proceed:</p>
                    <input
                      type="password"
                      placeholder="Enter security code"
                      value={resetCode}
                      onChange={(e) => setResetCode(e.target.value)}
                      className="p-2 border rounded w-full mb-4"
                    />
                    <div className="flex justify-end space-x-4">
                      <button
                        onClick={() => {
                          setShowResetModal(false);
                          setResetCode('');
                        }}
                        className="p-2 rounded shadow-md hover:shadow-lg transition-shadow duration-200"
                        style={{ backgroundColor: '#000000', color: '#FFD700', borderRadius: '8px' }}
                      >
                        Cancel
                      </button>
                      <button
                        onClick={confirmResetAllData}
                        className="p-2 rounded text-white shadow-md hover:shadow-lg transition-shadow duration-200"
                        style={{ backgroundColor: '#D40511', borderRadius: '8px' }}
                      >
                        Confirm
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>,
      document.getElementById('root')
    );
  </script>
<!-- ======= Proteção mínima (insere AQUI, antes de </body>) ======= -->
  <style>
  /* bloqueia seleção globalmente */
  * { -webkit-user-select: none; -ms-user-select: none; user-select: none; }

  /* libera em inputs/selects */
  input, textarea, select {
    -webkit-user-select: text; -ms-user-select: text; user-select: text;
  }

  /* libera dentro das abas (Home, Gaps, etc.) */
  .allow-copy, .allow-copy * {
    -webkit-user-select: text !important;
    -ms-user-select: text !important;
    user-select: text !important;
  }
</style>


  <script>
  // Bloqueios leves: contexto, seleção, arrasto
  document.addEventListener('contextmenu', e => {
  if (e.target.closest('.allow-copy')) return; // permite nas áreas liberadas
  e.preventDefault();
}, { capture: true });

document.addEventListener('selectstart', e => {
  if (e.target.closest('.allow-copy')) return; // permite seleção nas abas liberadas
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  e.preventDefault();
}, { capture: true });

  document.addEventListener('dragstart', e => e.preventDefault(), { capture: true });

  // Bloqueio de atalhos comuns (versão segura)
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const ctrl = e.ctrlKey || e.metaKey;
  const shift = e.shiftKey;

  // verifica se está numa área permitida
  const sel = window.getSelection && window.getSelection();
  const selNode = sel && sel.anchorNode
    ? (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement)
    : null;
  const inAllow = (document.activeElement && document.activeElement.closest('.allow-copy')) ||
                  (selNode && selNode.closest && selNode.closest('.allow-copy'));

  // 1) SEMPRE bloquear ver código / DevTools, em qualquer lugar
  if ((ctrl && k === 'u') || e.key === 'F12' || (ctrl && shift && ['i','j','c'].includes(k))) {
    e.preventDefault();
    e.stopPropagation();
    return;
  }

  // 2) Fora das áreas copiáveis, bloquear copiar / selecionar / imprimir / salvar
  if (!inAllow && ctrl && ['c','a','p','s'].includes(k)) {
    e.preventDefault();
    e.stopPropagation();
    return;
  }

  // 3) Dentro das abas copiáveis, Ctrl+C/A/S/P funcionam normalmente
}, { capture: true });


</script>

  <!-- ======= fim proteção mínima ======= -->
</body>
</html>
